<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
    <title>Contacto</title>
</head>
<body>
    <form action="gracias.html" method="get">
    <form action="formulario36.html" method="get"
    <!-- Grupo de Teléfono Completo -->
    <div class="form-group">
        <label>Número de Teléfono:</label>
        <div class="phone-group">
            
            <!-- Selector de Código de País -->
            <div class="phone-country">
                <select id="country-code" name="country-code" required>
                    <option value="" disabled selected>País</option>
                    <option value="+54">🇦🇷 +54</option>
                    <option value="+34">🇪🇸 +34</option>
                    <option value="+52">🇲🇽 +52</option>
                    <option value="+1">🇺🇸 +1</option>
                    <option value="+57">🇨🇴 +57</option>
                    <option value="+56">🇨🇱 +56</option>
                    <option value="+51">🇵🇪 +51</option>
                </select>
            </div>

            <!-- Campo de Código de Área -->
            <div class="phone-area">
                <input 
                    type="text" 
                    id="area-code" 
                    name="area-code" 
                    placeholder="Área (ej: 11)" 
                    pattern="[0-9]{2,5}" 
                    title="Código de área numérico (de 2 a 5 dígitos)" 
                    required
                >
            </div>

            <!-- Campo de Número Local -->
            <div class="phone-number">
                <input 
                    type="tel" 
                    id="phone" 
                    name="phone" 
                    placeholder="Número (ej: 44445555)" 
                    pattern="[0-9]{6,10}" 
                    title="Número de teléfono numérico" 
                    required
        
            </div>

            <button type="submit">Finalizar</button>
            <button type="submit" align="left">Atras</button>
        </form>
</body>
</html>
